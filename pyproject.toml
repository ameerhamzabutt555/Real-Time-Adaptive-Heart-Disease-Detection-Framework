[project]
name = "heart-disease-rt"
version = "0.1.0"
description = "Adaptive and real-time heart disease detection framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "river",
    "scipy",
    "joblib",
    "matplotlib",
    "fastapi",
    "pydantic",
    "uvicorn[standard]",
    "streamlit",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
